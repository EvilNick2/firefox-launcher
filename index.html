<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/style.css">
	<title>Firefox Launcher</title>
</head>
<body>
	<div class="content" id="profiles-container">
		<!-- This is where the generated cards will be placed -->
	</div>
	<div class="password-input-container">
		<input type="password" id="password-input" placeholder="Enter password">
		<button id="save-password-button">Save Password</button>
	</div>
	<script>
		function loadProfiles() {
			window.electron.getProfiles();
			window.electron.onProfilesReceived((profiles) => {
				const profilesContainer = document.getElementById('profiles-container');
				profilesContainer.innerHTML = '';
				const profileCards = [];

				profiles.forEach(profile => {
					const profileCard = document.createElement('div');
					profileCard.className = 'card';

					const profileImage = document.createElement('img');
					profileImage.src = 'imgs/firefox.png';
					profileImage.alt = 'Firefox Icon';
					profileImage.className = 'profile-icon';

					const profileText = document.createElement('span');
					profileText.textContent = profile;

					profileCard.appendChild(profileImage);
					profileCard.appendChild(profileText);
					profilesContainer.appendChild(profileCard);
					profileCards.push(profileCard);

					profileCard.addEventListener('click', () => {
						profileCard.classList.add('clicked');
						setTimeout(() => {
							profileCard.classList.remove('clicked');
						}, 300);
						window.electron.launchProfile(profile);
					});
				});

				let maxWidth = 0;
				profileCards.forEach(card => {
					const cardWidth = card.offsetWidth;
					if (cardWidth > maxWidth) {
						maxWidth = cardWidth;
					}
				});

				profileCards.forEach(card => {
					card.style.width = `${maxWidth}px`;
				});

				const contentHeight = profilesContainer.offsetHeight + 90;
				const adjustedWidth = maxWidth + 55;

				window.electron.setWindowSize(adjustedWidth, contentHeight);
			});
		}

		document.getElementById('save-password-button').addEventListener('click', () => {
			const password = document.getElementById('password-input').value;
			window.electron.savePassword(password);
		});

		loadProfiles();

		window.electron.refreshProfiles(() => {
			loadProfiles();
		});
	</script>
</body>
</html>
