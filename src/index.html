<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="fonts/css/all.min.css">
	<title>Firefox Launcher</title>
</head>
<body>
	<div class="content hidden" id="profiles-container">
		<!-- This is where the generated cards will be placed -->
	</div>
	
	<div class="password-verify">
		<h1>Password Verification</h1>
		<div class="password-input-container">
			<div class="password-container">
				<label for="password-input">
					<i class="fas fa-lock"></i>
				</label>
				<input type="password" name="password-input" id="password-input" placeholder="Enter password" autofocus>
				<i class="fa fa-eye-slash" id="togglePassword"></i>
			</div>
			<button id="password-button">Submit</button>
		</div>
		<div id="error-message" class="error-message hidden">Wrong password. Please try again.</div>
	</div>

	<script src="js/main.js"></script>
	<script src="js/toggle_password.js"></script>
</body>
</html>
