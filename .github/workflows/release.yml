name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version from package.json
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check if release already exists
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${{ steps.pkg.outputs.version }}`;
            try {
              await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag });
              core.setOutput('exists', 'true');
            } catch (e) {
              core.setOutput('exists', 'false');
            }

      - name: Build installer (no publish)
        if: steps.check.outputs.exists != 'true'
        run: npm run ci:dist:installer
        env:
          CSC_SKIP_SIGNING: true

      - name: Create or update GitHub Release and upload only .exe
        if: steps.check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Firefox Launcher v${{ steps.pkg.outputs.version }}
          files: |
            dist/*.exe
          draft: false
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
